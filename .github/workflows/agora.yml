name: Agora checks its own receipts

# The demo, and the honesty test: a tool that asks repositories to verify
# agent receipts in CI verifies its own.
#
# Runs from source rather than through `action.yml`, on purpose: the Action runs
# the published package, and this has to work on a commit that has not been
# published yet. When a release is out, the composite path is exercised by the
# consumers of `uses: IrgenSlj/agora@v0`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily, because advisories land on days nobody pushes.
    - cron: '15 7 * * *'
  workflow_dispatch:

concurrency:
  group: agora-self-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Receipts are verified per commit across the pull request's range.
          fetch-depth: 0

      # Receipts live in git notes, which a checkout does not fetch.
      - name: Fetch receipts
        run: git fetch --no-tags origin 'refs/notes/agora:refs/notes/agora' || echo "no receipts pushed yet"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run build

      # Not `--fail-on-unknown`: commits made by hand carry no receipt, and
      # that is reported as not established, which is the true answer.
      - name: agora ci
        run: node dist/cli.js ci
