name: Sync the revocation feed from OSV

# The half of the revocation plane that used to need a human. Walks the official
# MCP registry for the artifact universe, queries OSV for every one of them,
# rewrites feed/entries.json, and — when a signing key exists — signs and
# commits the result.
#
# The walk is thousands of records and roughly a hundred OSV batches, so this is
# a minutes-long job rather than a seconds-long one. That is the cost of the
# feed knowing about more than a hand-maintained list.
#
# Daily rather than hourly on purpose: advisories are published on human
# timescales, OSV is a free service Agora should not hammer, and a feed that
# churns every hour produces noise rather than signal. Clients poll every 6h and
# tolerate a stale feed by design.

on:
  schedule:
    # 06:15 UTC. Off the hour because every cron in the world fires on it.
    - cron: '15 6 * * *'
  workflow_dispatch:

concurrency:
  group: revocation-feed
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Bounded so a hung registry walk fails visibly instead of occupying a
    # runner for six hours and then being cancelled with no explanation.
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Exits non-zero if any OSV lookup failed *or* the registry walk ended
      # early. Both are the same hazard: an artifact that was never asked about
      # is not an artifact that came back clean, and letting the difference
      # collapse would drop live advisories. Existing entries are kept in either
      # case, and the job goes red so somebody knows the view was partial.
      - name: Walk the registry and query OSV
        run: bun scripts/sync-feed.ts

      # Writes feed/revocations.json. Signs it when AGORA_FEED_SIGNING_KEY is
      # set, and otherwise emits it unsigned — which is the normal case and not
      # a degraded one. An unsigned fetched feed is merged additively by the
      # client (src/revocation/merge.ts), so it can contribute revocations but
      # never remove one, and the copy bundled in the npm package is covered by
      # that package's provenance. A signature would buy the ability to
      # *withdraw* an entry between releases; nothing here needs that yet.
      - name: Build the feed
        run: bun scripts/sign-feed.ts
        env:
          AGORA_FEED_SIGNING_KEY: ${{ secrets.AGORA_FEED_SIGNING_KEY }}
          AGORA_FEED_KEY_ID: ${{ vars.AGORA_FEED_KEY_ID }}

      - name: Commit
        run: |
          if git diff --quiet feed/; then
            echo "Feed unchanged; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/
          git commit -m "Sync revocation feed from OSV ($(node -p "require('./feed/entries.json').entries.length") entries)"
          git push

      # This job died silently for five weeks in 2026: `main` requires status
      # checks, a push made with GITHUB_TOKEN does not trigger the workflow that
      # reports them, so the bot's push was rejected every single night while
      # clients kept polling a frozen feed. Nothing surfaced it, because a red
      # cron job on a repo nobody watches is indistinguishable from silence.
      #
      # So the feed now reports its own death. One issue, reopened and updated
      # rather than duplicated, because a hundred identical issues is the same
      # silence in a louder form.
      - name: Say so when the feed cannot be published
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Revocation feed sync is failing"
          body=$(printf '%s\n' \
            "The daily OSV sync could not publish \`feed/revocations.json\`." \
            "" \
            "Clients poll this file directly, so while this is red **every user is" \
            "reading a frozen feed** — including the copy bundled into the next release." \
            "" \
            "Failed run: $RUN_URL" \
            "" \
            "Common cause: branch protection on \`main\` requires status checks, and a" \
            "push made with \`GITHUB_TOKEN\` never triggers the workflow that reports" \
            "them, so the push is rejected indefinitely." \
            "" \
            "_Opened automatically. It will be updated, not duplicated._")
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label "" || \
              gh issue create --title "$title" --body "$body"
          fi
