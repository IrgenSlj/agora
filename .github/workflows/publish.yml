name: Publish to npm

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag to publish under'
        required: true
        default: 'latest'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` so the major tag can be moved. The Action is
      # referenced as `@v0`, and a tag nobody creates is a README line that
      # errors with "Unable to resolve action" — see the tag step below.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # bun runs the checks; npm does the publishing. Trusted publishing (OIDC)
      # needs npm >= 11.5.1, which is newer than some runner images ship.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck:cli

      # `bun run test` (vitest), never `bun test`. Bun's native runner panics on
      # this suite (NAPI fatal error, exit 132) and that is exactly how v0.7.0
      # failed to publish: the release fired, this step crashed, and npm stayed
      # on 0.6.1 for weeks with the entire trust plane sitting in main.
      # test/release/publish-workflow.test.ts pins this against ci.yml.
      - name: Tests
        run: bun run test

      - name: Build
        run: bun run build

      # Two supported auth paths, in preference order:
      #
      #   1. Trusted publishing (OIDC). Nothing to configure here — you enable
      #      it per package on npmjs.com against this repo + workflow. No token
      #      exists, so none can leak or expire. Provenance is implied.
      #   2. NPM_TOKEN, an npm automation token stored as a repo secret.
      #
      # Every publish run before 2026-07-30 failed ENEEDAUTH because neither was
      # ever set up; the npm releases that exist were pushed by hand. If this
      # step fails with ENEEDAUTH, that is what it means — pick one of the two.
      #
      # `tag` goes through env, never string-interpolation into the script: a
      # workflow_dispatch input is attacker-controllable text and `${{ }}` would
      # splice it straight into the shell.
      # One package. `opencode-agora` was a second npm name for the same
      # product; what shipped under it was never a re-export but a pre-pivot
      # standalone plugin, so the two names had drifted into two products with
      # separate users. Everything is `agora-hub` now.
      - name: Publish agora-hub to npm
        run: bash .github/scripts/npm-publish.sh
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.event.inputs.tag || 'latest' }}

      # `uses: IrgenSlj/agora@v0` is the surface the product is pointed at, and
      # `v0` is a floating tag that has to be moved to each release by hand or
      # by this step. It was never moved by hand: v0.7.0 shipped, the README
      # advertised `@v0`, and no such tag existed, so the one call-to-action in
      # the project errored for every reader.
      #
      # It runs after the publish step on purpose. The tag says "this ref is
      # runnable", and it is not runnable until the npm package the composite
      # action shells out to actually exists.
      - name: Move the major tag the Action is referenced by
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          major="v$(echo "${RELEASE_TAG#v}" | cut -d. -f1)"
          echo "Moving $major to $RELEASE_TAG"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$major" "$RELEASE_TAG^{commit}"
          git push -f origin "refs/tags/$major"
